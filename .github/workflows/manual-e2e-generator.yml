name: Manual E2E Test Generator

on:
  workflow_dispatch:
    inputs:
      component_path:
        description: 'Path to component/page to test (e.g., pages/LandingPage.tsx)'
        required: true
        type: string
      test_scenarios:
        description: 'Test scenarios to generate (comma-separated)'
        required: false
        type: string
        default: 'basic navigation, user interactions, form submission'
      browser:
        description: 'Browser to test with'
        required: false
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
        default: chromium

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-test:
    name: Generate and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Read component source
        id: read-source
        run: |
          if [ -f "${{ github.event.inputs.component_path }}" ]; then
            echo "✅ Component found: ${{ github.event.inputs.component_path }}"
            echo "component-exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Component not found: ${{ github.event.inputs.component_path }}"
            echo "component-exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Generate test file
        if: steps.read-source.outputs.component-exists == 'true'
        run: |
          # Extract component name
          COMPONENT_NAME=$(basename "${{ github.event.inputs.component_path }}" .tsx)
          TEST_FILE="tests/e2e/${COMPONENT_NAME}.spec.ts"
          TEST_SCENARIOS="${{ github.event.inputs.test_scenarios }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          echo "Generating test for: $COMPONENT_NAME"
          
          # Create test file with AI-guided structure
          cat > "$TEST_FILE" << EOF
          import { test, expect } from '@playwright/test';
          
          /**
           * E2E Tests for ${COMPONENT_NAME}
           * Auto-generated by AI workflow
           * 
           * Test Scenarios: ${TEST_SCENARIOS}
           * Generated: ${TIMESTAMP}
           */
          
          test.describe('${COMPONENT_NAME}', () => {
            test.beforeEach(async ({ page }) => {
              // Navigate to the page before each test
              await page.goto('/');
              await page.waitForLoadState('networkidle');
            });
          
            test('should load the component successfully', async ({ page }) => {
              // Verify the page is loaded
              const body = await page.locator('body');
              await expect(body).toBeVisible();
              
              // Add specific assertions based on the component
              // TODO: AI should analyze the component and add specific checks
            });
          
            test('should handle user interactions', async ({ page }) => {
              // Test user interactions
              // TODO: AI should identify interactive elements and test them
              
              await page.waitForTimeout(1000); // Give time for any animations
            });
          
            test('should be responsive', async ({ page }) => {
              // Test responsive design
              await page.setViewportSize({ width: 375, height: 667 }); // Mobile
              await expect(page.locator('body')).toBeVisible();
              
              await page.setViewportSize({ width: 1920, height: 1080 }); // Desktop
              await expect(page.locator('body')).toBeVisible();
            });
          });
          EOF
          
          echo "✅ Test file generated: $TEST_FILE"
          echo "test-file=$TEST_FILE" >> $GITHUB_OUTPUT
      
      - name: Install Playwright browsers
        run: |
          if [ "${{ github.event.inputs.browser }}" = "all" ]; then
            pnpm exec playwright install --with-deps
          else
            pnpm exec playwright install --with-deps ${{ github.event.inputs.browser }}
          fi
      
      - name: Run generated tests
        id: run-tests
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.browser }}" = "all" ]; then
            pnpm exec playwright test
          else
            pnpm exec playwright test --project=${{ github.event.inputs.browser }}
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
      
      - name: Create PR with generated test
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            🤖 Add E2E test for ${{ github.event.inputs.component_path }}
            
            Generated test scenarios: ${{ github.event.inputs.test_scenarios }}
          branch: ai/e2e-test-${{ github.run_number }}
          title: '🤖 AI-Generated E2E Test'
          body: |
            ## AI-Generated E2E Test
            
            This PR adds an E2E test generated by the AI workflow.
            
            **Component**: `${{ github.event.inputs.component_path }}`
            **Test Scenarios**: ${{ github.event.inputs.test_scenarios }}
            **Browser**: ${{ github.event.inputs.browser }}
            
            ### Test Results
            - Initial test run: ${{ steps.run-tests.outcome }}
            - Check the workflow artifacts for detailed results
            
            ### Next Steps
            1. Review the generated test
            2. Add component-specific assertions
            3. Verify test passes in all browsers
            4. Merge when ready
            
            ---
            *Generated by AI E2E Test Workflow*
          labels: |
            e2e-tests
            ai-generated
            automated
